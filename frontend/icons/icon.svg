<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer HUD Frame -->
  <rect x="56" y="56" width="400" height="400" rx="32" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="160 40 80 40" filter="url(#glowCyan)" />

  <!-- Corner Brackets -->
  <path d="M 40 120 L 40 40 L 120 40" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  <path d="M 472 120 L 472 40 L 392 40" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  <path d="M 40 392 L 40 472 L 120 472" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  <path d="M 472 392 L 472 472 L 392 472" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />

  <!-- Inner CPU Die -->
  <rect x="156" y="156" width="200" height="200" rx="16" fill="#0b1329" stroke="#10b981" stroke-width="8" filter="url(#glowEmerald)" />

  <!-- CPU Circuit Pins -->
  <line x1="256" y1="56" x2="256" y2="156" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="356" x2="256" y2="456" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="56" y1="256" x2="156" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="356" y1="256" x2="456" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <line x1="200" y1="76" x2="200" y2="156" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="312" y1="76" x2="312" y2="156" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="356" x2="200" y2="436" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="312" y1="356" x2="312" y2="436" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Center Core Glow -->
  <circle cx="256" cy="256" r="48" fill="#06b6d4" opacity="0.9" filter="url(#glowCyan)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>